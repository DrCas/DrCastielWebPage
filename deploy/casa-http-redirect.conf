# The HTTP port already serves public sites; only tailnet clients get this redirect.
geo $casa_private_client {
    default 0;
    100.64.0.0/10 1;
}
server {
    listen 80;
    server_name casa.drcastiel.com;
    if ($casa_private_client = 0) { return 403; }
    return 308 https://casa.drcastiel.com$request_uri;
}
