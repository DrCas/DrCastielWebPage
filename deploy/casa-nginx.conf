# Private HTTPS gateway; independent of the public website's Nginx master.
user www-data;
worker_processes 1;
pid /run/drcastiel-casa/nginx.pid;
error_log /var/log/nginx/casa-error.log warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format casa_private '$remote_addr - $host [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /var/log/nginx/casa-access.log casa_private;
    client_body_temp_path /var/lib/drcastiel-casa/body;
    proxy_temp_path /var/lib/drcastiel-casa/proxy;
    server_tokens off;
    map $http_upgrade $casa_connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 100.71.117.23:443 ssl;
        server_name casa.drcastiel.com;
        allow 100.64.0.0/10;
        deny all;
        ssl_certificate /etc/letsencrypt/live/casa.drcastiel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/casa.drcastiel.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:CASA_TLS:10m;
        ssl_session_timeout 1d;
        client_max_body_size 0;
        location / {
            proxy_pass http://100.117.231.66:80;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $casa_connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
    server {
        listen 100.71.117.23:8111 ssl;
        server_name casa.drcastiel.com;
        client_max_body_size 1g;
        allow 100.64.0.0/10;
        deny all;
        ssl_certificate /etc/letsencrypt/live/casa.drcastiel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/casa.drcastiel.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location / {
            proxy_pass https://100.117.231.66:8111;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/drcastiel/crafty-origin.pem;
            proxy_ssl_name 2c1c756c3a49;
            proxy_ssl_server_name on;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $casa_connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
